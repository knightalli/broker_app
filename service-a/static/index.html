<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>broker_app — демо</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, Consolas, monospace; background: #0f1115; color: #d7dce4;
         max-width: 860px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; } h1 small { color: #7d8590; font-weight: normal; }
  .panel { background: #161b22; border: 1px solid #2b333d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  textarea { width: 100%; height: 70px; background: #0d1117; color: #d7dce4; border: 1px solid #2b333d;
             border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 9px 16px;
           font: inherit; cursor: pointer; margin-right: 8px; margin-top: 10px; }
  button.chaos { background: #9e2a2b; }
  button:hover { filter: brightness(1.15); }
  .job { border: 1px solid #2b333d; border-radius: 8px; padding: 12px 14px; margin-top: 12px; background: #0d1117; }
  .job .id { color: #7d8590; font-size: 12px; }
  .badge { display: inline-block; border-radius: 10px; padding: 2px 10px; font-size: 12px; margin-left: 8px; }
  .ACCEPTED { background: #9e6a03; }
  .DONE { background: #238636; }
  .redelivered { background: #8957e5; }
  .meta { color: #7d8590; font-size: 12px; margin-top: 6px; }
  pre { background: #161b22; border-radius: 6px; padding: 8px; font-size: 12px; overflow-x: auto; margin: 8px 0 0; }
  .hint { color: #7d8590; font-size: 12px; margin-top: 8px; }
  a { color: #58a6ff; }
</style>
</head>
<body>
<h1>broker_app <small>service-a → RabbitMQ → service-b</small></h1>

<div class="panel">
  <textarea id="payload">{"topic": "demo", "text": "hello broker"}</textarea>
  <button onclick="send(false)">Отправить задачу (POST /jobs)</button>
  <button class="chaos" onclick="send(true)">Проверить at-least-once 💥</button>
  <div class="hint">
    Красная кнопка шлёт задачу с <code>"chaos":"crash"</code>: воркер B «падает» до ack,
    сообщение возвращается в очередь и доставляется повторно (бейдж <b>redelivered</b>).
    Очереди: <a href="http://localhost:15672" target="_blank">RabbitMQ UI</a> (guest/guest).
  </div>
</div>

<div id="jobs"></div>

<script>
const jobs = document.getElementById('jobs');
const pollers = {};

async function send(chaos) {
  let payload;
  try { payload = JSON.parse(document.getElementById('payload').value); }
  catch { alert('невалидный JSON в поле ввода'); return; }
  if (chaos) payload = { ...payload, chaos: 'crash' };

  const t0 = performance.now();
  const r = await fetch('/jobs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const postMs = Math.round(performance.now() - t0);
  const job = await r.json();
  render(job, postMs, chaos);
  pollers[job.id] = setInterval(() => poll(job.id), 1000);
}

async function poll(id) {
  const r = await fetch('/jobs/' + id);
  if (!r.ok) return;
  const job = await r.json();
  update(job);
  if (job.status === 'DONE') clearInterval(pollers[id]);
}

function el(job, postMs, chaos) {
  let div = document.getElementById('job-' + job.id);
  if (!div) {
    div = document.createElement('div');
    div.className = 'job';
    div.id = 'job-' + job.id;
    jobs.prepend(div);
  }
  div.innerHTML =
    `<span class="id">${job.id}</span>` +
    `<span class="badge ${job.status}">${job.status}</span>` +
    (job.redelivered ? '<span class="badge redelivered">redelivered</span>' : '') +
    `<div class="meta">` +
      (postMs != null ? `POST → 202 за ${postMs} мс${chaos ? ' (хаос-режим)' : ''} · ` : '') +
      `создано: ${job.created_at || '—'}` +
      (job.completed_at ? ` · выполнено: ${job.completed_at}` : '') +
    `</div>` +
    (job.result ? `<pre>${JSON.stringify(job.result, null, 2)}</pre>` : '');
  return div;
}
function render(job, postMs, chaos) { el(job, postMs, chaos); }
function update(job) { el(job, null, false); }
</script>
</body>
</html>
