services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: broker-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest / guest)
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 12

  service-a:
    build: ./service-a
    container_name: broker-service-a
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  service-b:
    build: ./service-b
    container_name: broker-service-b
    restart: unless-stopped   # auto-restart after the "chaos" crash demo
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
